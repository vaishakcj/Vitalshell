    <script>
      // Ensure window.fetch has both a getter and a setter so external wrappers
      // or sandbox interceptors can assign to window.fetch without throwing:
      // "TypeError: Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _origFetch = typeof window !== 'undefined' && window.fetch ? window.fetch.bind(window) : null;
          var _currentFetch = _origFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // Ignore if environment forbids redefining
        }
      })();
    </script>
